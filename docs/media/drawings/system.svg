<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 980" width="1500" height="980" role="img" aria-labelledby="t d"><title id="t">Sistem şeması</title><desc id="d">Ana bilgisayar ve sunucu, Wi-Fi yönlendirici, iki Pico robot, iki Pi 4 robot ve arena ile veri akışı.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b3261e"/></marker></defs><rect width="1500" height="980" fill="#f7f5ee"/>
